# trueseal-relay — the shipped, supported single-Node deployment (ADR-0012).
#
# Relay-only on purpose: no log viewer, no reverse proxy, no Docker socket
# mount. Logs are private to the Operator (normal mode carries no client
# metadata at all; verbose logging exists only as the explicit per-invocation
# dev mode). Health stays on the container network — Docker's own
# HEALTHCHECK uses it (RELAY-10). The experimental Postgres cluster lives in
# experimental/ and is NOT a supported preview deployment.
#
# The image is pinned to an exact version. G8 forbids a `:latest` default:
# set RELAY_IMAGE in .env to the version the Compatibility Table lists for
# your TrueSeal Release, e.g.
#   RELAY_IMAGE=ghcr.io/julianbonomini/trueseal-relay:v0.2.0

services:
  relay:
    build: .   # used locally; production pulls the pinned image from GHCR
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE in .env to an exact tag, e.g. ghcr.io/julianbonomini/trueseal-relay:v0.2.0 — :latest is never a valid value}
    restart: unless-stopped
    # Above the 10 s graceful-shutdown drain (ADR-0012; TRUESEAL_RELAY_SHUTDOWN_DRAIN),
    # so SIGKILL never interrupts an in-flight commit the drain would have finished.
    stop_grace_period: 15s
    ports:
      - "7700:7700"   # Receive sessions (Noise XX) — devices
      - "7701:7701"   # Push sessions (Noise NK) — trueseal-sync
      # Health (7702) is NOT published: the Dockerfile HEALTHCHECK reaches
      # it inside the container network (RELAY-10; ADR-0012).
    volumes:
      - relay-data:/data
    environment:
      TRUESEAL_RELAY_KEYPAIR_PATH: /data/keypair.hex
      TRUESEAL_RELAY_STORE_SQLITE_PATH: /data/inbox.db
      # Optional: supply your own keypair instead of auto-generating
      # TRUESEAL_RELAY_KEYPAIR_HEX: ${TRUESEAL_RELAY_KEYPAIR_HEX:-}
      # TRUESEAL_RELAY_TTL: "720h"
      # TRUESEAL_RELAY_REAP_INTERVAL: "1h"
      # TRUESEAL_RELAY_MAX_CONNECTIONS: "1000"
    command: ["-no-config"]

volumes:
  relay-data:
    driver: local
