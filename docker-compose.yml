services:
  relay:
    build: .   # used locally; VPS pulls pre-built image from GHCR via CI
    image: ${RELAY_IMAGE:-ghcr.io/julianbonomini/trueseal-relay:latest}
    restart: unless-stopped
    ports:
      - "7700:7700"   # Receive sessions (Noise XX) — devices
      - "7701:7701"   # Push sessions (Noise NK) — trueseal-sync
      - "7702:7702"   # Health endpoint — local testing only (Caddy proxies this in prod)
    volumes:
      - relay-data:/data
    environment:
      TRUESEAL_RELAY_KEYPAIR_PATH: /data/keypair.hex
      TRUESEAL_RELAY_STORE_SQLITE_PATH: /data/inbox.db
      # Optional: supply your own keypair instead of auto-generating
      # TRUESEAL_RELAY_KEYPAIR_HEX: ${TRUESEAL_RELAY_KEYPAIR_HEX:-}
      # TRUESEAL_RELAY_TTL: "720h"
      # TRUESEAL_RELAY_REAP_INTERVAL: "1h"
      # TRUESEAL_RELAY_MAX_CONNECTIONS: "1000"
    command: ["-no-config"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [production]
    ports:
      - "80:80"     # HTTP → HTTPS redirect + ACME challenge
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
      LOGS_DOMAIN: ${LOGS_DOMAIN}
    depends_on:
      - relay
      - dozzle

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "8080:8080"   # Log viewer — local testing only (Caddy proxies this in prod)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_AUTH: "true"   # public read-only log viewer

volumes:
  relay-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
