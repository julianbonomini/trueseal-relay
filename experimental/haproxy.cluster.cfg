# HAProxy config for the EXPERIMENTAL Postgres cluster.
# TCP mode: the relay speaks raw Noise-over-TCP, so HAProxy is a transparent
# byte pipe. ADR-0011: no client IP logging anywhere — `option tcplog` is
# deliberately absent, so HAProxy emits no per-connection lines (its startup
# messages on stdout carry no client data).

global
    maxconn 4096

defaults
    mode    tcp
    option  dontlognull
    timeout connect 5s
    timeout client  24h   # Receive sessions are long-lived
    timeout server  24h

# -- Receive sessions (Noise XX) -- devices connect here -------------------
frontend receive
    bind *:7700
    default_backend receive_nodes

backend receive_nodes
    balance roundrobin
    option  tcp-check
    server  relay-1 relay-1:7700 check inter 10s
    server  relay-2 relay-2:7700 check inter 10s

# -- Push sessions (Noise NK) -- trueseal-sync connects here ---------------
frontend push
    bind *:7701
    default_backend push_nodes

backend push_nodes
    balance roundrobin
    option  tcp-check
    server  relay-1 relay-1:7701 check inter 10s
    server  relay-2 relay-2:7701 check inter 10s

# -- Health endpoint (HTTP) ------------------------------------------------
frontend health
    bind *:7702
    mode http
    default_backend health_nodes

backend health_nodes
    mode http
    balance roundrobin
    option  httpchk GET /healthz
    server  relay-1 relay-1:7702 check inter 10s
    server  relay-2 relay-2:7702 check inter 10s
