# trueseal-relay — EXPERIMENTAL clustered deployment (Postgres)
#
# Two relay Nodes sharing one Postgres inbox store. An HAProxy load balancer
# distributes Push and Receive connections across both Nodes.
#
# EXPERIMENTAL per ADR-0012 "Storage backends": the supported preview
# deployment is the single-Node SQLite compose at the repo root. Postgres is
# not versioned (ADR-0013) and this file may change or disappear.
#
# Like the shipped compose, this is relay-only: no log viewer, no reverse
# proxy, no Docker socket mount. Logs are private (ADR-0012); HAProxy runs
# with connection logging OFF (ADR-0011 — no client IP logging anywhere).
# Health stays on the container network.
#
# Usage:
#   1. Start Postgres:
#        docker compose -f experimental/docker-compose.cluster.yml up -d db
#   2. Start everything:
#        docker compose -f experimental/docker-compose.cluster.yml up -d
#
# No manual keypair step: the first Node to start generates /data/keypair.hex
# in the shared relay-data volume (mode 0600, create-exclusive); a racing
# second Node loads the winner's key. Print what clients configure with:
#   docker compose -f experimental/docker-compose.cluster.yml exec relay-1 /trueseal-relay pubkey
#
# IMPORTANT: Replace POSTGRES_PASSWORD and the DSN password with a strong
# secret before deploying.

services:

  # -- Postgres inbox store --------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: trueseal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: trueseal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d trueseal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -- Relay Node 1 ----------------------------------------------------------
  relay-1:
    build: ..
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to an exact tag, e.g. ghcr.io/julianbonomini/trueseal-relay:v0.2.0 — :latest is never a valid value}
    container_name: trueseal-relay-1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - relay-data:/data
    environment:
      TRUESEAL_RELAY_KEYPAIR_PATH: /data/keypair.hex
      TRUESEAL_RELAY_STORE_TYPE: postgres
      TRUESEAL_RELAY_STORE_POSTGRES_DSN: "postgres://relay:changeme@db:5432/trueseal?sslmode=disable"
      # TRUESEAL_RELAY_TTL: "720h"
      # TRUESEAL_RELAY_REAP_INTERVAL: "1h"
    command: ["-no-config"]

  # -- Relay Node 2 ----------------------------------------------------------
  relay-2:
    build: ..
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to an exact tag, e.g. ghcr.io/julianbonomini/trueseal-relay:v0.2.0 — :latest is never a valid value}
    container_name: trueseal-relay-2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - relay-data:/data
    environment:
      TRUESEAL_RELAY_KEYPAIR_PATH: /data/keypair.hex
      TRUESEAL_RELAY_STORE_TYPE: postgres
      TRUESEAL_RELAY_STORE_POSTGRES_DSN: "postgres://relay:changeme@db:5432/trueseal?sslmode=disable"
      # TRUESEAL_RELAY_TTL: "720h"
      # TRUESEAL_RELAY_REAP_INTERVAL: "1h"
    command: ["-no-config"]

  # -- Load balancer ---------------------------------------------------------
  # HAProxy in TCP mode. The relay uses raw Noise-over-TCP — standard HTTP
  # proxies cannot handle this. HAProxy's TCP mode is transparent to the
  # Noise handshake. Connection logging is OFF (no tcplog, ADR-0011).
  lb:
    image: haproxy:alpine
    container_name: trueseal-lb
    restart: unless-stopped
    depends_on:
      - relay-1
      - relay-2
    ports:
      - "7700:7700"   # Receive sessions (Noise XX) — devices
      - "7701:7701"   # Push sessions (Noise NK) — trueseal-sync
    volumes:
      - ./haproxy.cluster.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

volumes:
  postgres-data:
    driver: local
  relay-data:
    driver: local
