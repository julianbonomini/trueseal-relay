name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Build (hostile tag)
        run: go build -tags hostile ./...

      - name: Test (hostile tag)
        run: go test -race -tags hostile ./...

      # RELAY-14: a release build must contain no Hostile Relay hook code
      # and no control listener, and must offer no runtime enrollment
      # path. Proven two ways: no internal/hostile symbol survives
      # linking, and the -hostile-control flag is undefined.
      - name: Release build excludes the Hostile Relay surface
        run: |
          go build -o /tmp/trueseal-relay-release ./cmd/trueseal-relay
          if go tool nm /tmp/trueseal-relay-release | grep "internal/hostile"; then
            echo "::error::release build contains hostile hook symbols"
            exit 1
          fi
          if /tmp/trueseal-relay-release -hostile-control 127.0.0.1:1 2>&1 | grep -q "flag provided but not defined"; then
            echo "OK: -hostile-control is undefined in release builds"
          else
            echo "::error::-hostile-control must not exist in release builds"
            exit 1
          fi

      # RELAY-15: the shipped compose is relay-only with an exact image tag;
      # validate both compose files parse (with RELAY_IMAGE set, since the
      # files refuse to render without it) and never reference :latest.
      - name: Compose files are valid and carry no :latest
        run: |
          export RELAY_IMAGE=ghcr.io/example/trueseal-relay:v0.0.0-test
          docker compose config -q
          docker compose -f experimental/docker-compose.cluster.yml config -q
          if grep -n ':latest' docker-compose.yml experimental/docker-compose.cluster.yml; then
            echo "::error::a compose file references :latest (gate G8)"
            exit 1
          fi
          if grep -rn 'tcplog' experimental/; then
            echo "::error::HAProxy tcplog must never ship (ADR-0011)"
            exit 1
          fi
          echo "OK: compose files valid, no :latest, no tcplog"
